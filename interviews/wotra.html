композиция. Отдельно разбираем «Каменное лицо справедливости» и его отношение к ИИ и постоянной учёбе.", "en": "Leonid Skrabets / Wotra, a tattoo artist at Sagma Tattoo Gallery in Warsaw, talks about his journey from a first rose-and-sword tattoo to colour realism, his work at Sagma Tattoo Gallery, and projects that bring together humour, the client's idea and complex composition. We also look at “The Stone Face of Justice” and his views on AI and continuous learning."}, "editor_note": {"ru": "Исходные вопросы не предоставлены. Вопросы и названия тем восстановлены редакцией по ответам. Русские ответы мастера сохранены полностью; английская версия — редакционный перевод.", "en": "The original questions were not supplied. The questions and topic headings were reconstructed by the editors from the answers. The artist’s Russian answers are presented in full; the English version is an editorial translation."}}, "chapters": [{"id": 1, "title": {"ru": "Какой была ваша первая татуировка и как вы её сделали?", "en": "What was your first tattoo, and how did you make it?"}, "theme": {"ru": "Первая татуировка", "en": "The first tattoo"}, "answer": {"ru": "Первая тату была розой, проткнутой мечом. Сначала нарисовал её на листике простым карандашом, после перенёс рисунок на искусственную кожу и только тогда фрихендом нарисовал ручкой на коже клиента. Наколол всё иглой 3RL. Ох и мороки было — вам не передать! Никаких знаний не имел, лишь желание сделать красивый рисунок на коже 😅", "en": "My first tattoo was a rose pierced by a sword. First I drew it on a little piece of paper with a pencil, then transferred the drawing onto practice skin, and only after that drew it freehand with a pen on the client's skin. I tattooed the whole thing with a 3RL needle. Oh, what a hassle that was — you have no idea! I had no knowledge at all, just a desire to make a beautiful drawing on skin 😅"}, "title_kind": "editorial_reconstructed"}, {"id": 2, "title": {"ru": "Как вы пришли к цветному реализму и кто помог увидеть его возможности?", "en": "How did you arrive at colour realism, and who helped you see its possibilities?"}, "theme": {"ru": "Путь к цветному реализму", "en": "The path to colour realism"}, "answer": {"ru": "Попав в первую студию в качестве настоящего татуировщика, я понял, что залог успеха — это постоянное и постепенное развитие, а также совершенствование своих навыков. Начал я с надписей, затем плавно перешёл к олдскулу, графике, чёрно-белому реализму, чёрно-белому реализму с цветными вставками, потом — к цветным мультяшкам, а тогда уже к сюрреализму и реализму. В тот период пришло понимание неограниченных возможностей цветного реализма! Тогда начал углубляться, читать большое количество книг, рисовать. Но именно учитель показал мне, что цветные работы — это бескрайний океан возможностей!", "en": "When I joined my first studio as a proper tattoo artist, I realised that the key to success was constant, gradual development and improving my skills. I started with lettering, then gradually moved into old school, graphic work, black-and-grey realism, black-and-grey realism with touches of colour, then colourful cartoon pieces, and after that surrealism and realism. During that period, I came to understand the limitless possibilities of colour realism! I began exploring it more deeply, reading a lot of books and drawing. But it was my teacher who showed me that colour work is an endless ocean of possibilities!"}, "title_kind": "editorial_reconstructed"}, {"id": 3, "title": {"ru": "О чём вы думаете при подготовке работы, чтобы она сохранялась со временем?", "en": "What do you consider when preparing a tattoo so that it lasts over time?"}, "theme": {"ru": "Композиция и кожа", "en": "Composition and skin"}, "answer": {"ru": "Чтобы мои работы жили долго, первоначально стараюсь обдумать композицию, баланс контрастных пятен и умеренность детализации. После подстраиваю технические факторы под индивидуальные особенности кожи клиента.", "en": "To make my work last, I first try to think through the composition, the balance of contrasting shapes and a restrained amount of detail. Then I adapt the technical factors to the individual characteristics of the client's skin."}, "title_kind": "editorial_reconstructed"}, {"id": 4, "title": {"ru": "Как рождаются идеи больших работ на спине и как устроены коллаборации в студии?", "en": "How do ideas for large back pieces develop, and how do collaborations work in the studio?"}, "theme": {"ru": "Большие работы и команда", "en": "Large pieces and teamwork"}, "answer": {"ru": "Всё начинается с идеи и посыла, которые вкладываются в каждую работу. Откровенно говоря, большая часть работ на спинах на моей странице — это продукт коллабораций с мастерами из Sagma Tattoo Gallery. Перед каждой работой у нас происходит интенсивный мозговой штурм, во время которого обдумывается каждая деталь!", "en": "Everything starts with the idea and the message that go into each piece. To be honest, a large share of the back pieces on my page are the result of collaborations with artists from Sagma Tattoo Gallery. Before each piece, we have an intense brainstorming session in which we think through every detail!"}, "title_kind": "editorial_reconstructed"}, {"id": 5, "title": {"ru": "Отличаются ли запросы клиентов из стран СНГ от запросов других клиентов?", "en": "Do clients from CIS countries ask for different things from other clients?"}, "theme": {"ru": "Запросы клиентов", "en": "What clients ask for"}, "answer": {"ru": "Я часто работаю с клиентами из стран СНГ, но не могу сказать, что их запросы чем-то отличаются от запросов других клиентов. Все люди как люди: кто-то хочет вложить глубокий смысл, а кто-то — просто себя порадовать!", "en": "I often work with clients from CIS countries, but I can't say that their requests differ from those of other clients. People are people: some want to put deep meaning into a piece, while others simply want to treat themselves!"}, "title_kind": "editorial_reconstructed"}, {"id": 6, "title": {"ru": "Как юмор попадает в ваши работы и где вы находите вдохновение?", "en": "How does humour find its way into your work, and where do you find inspiration?"}, "theme": {"ru": "Юмор и вдохновение", "en": "Humour and inspiration"}, "answer": {"ru": "Мне очень нравится вкладывать в работы стёб, юмор и смысл! Стараюсь подчеркнуть желание клиента через призму своего восприятия! Когда объясняю человеку свой посыл, он зачастую соглашается на весьма заковыристые проекты 😅 На данный момент я работаю в очень сильной команде, где и черпаю своё вдохновение! Стараюсь многое перенять у своего учителя Алексея Захарова!", "en": "I really enjoy putting playful irony, humour and meaning into my work! I try to express what the client wants through the lens of my own perception! When I explain my message to someone, they often agree to quite intricate projects 😅 Right now I work with a very strong team, which is where I draw my inspiration! I try to learn a lot from my teacher, Alexey Zakharov!"}, "title_kind": "editorial_reconstructed"}, {"id": 7, "title": {"ru": "Какой проект перекрытия вы считаете своим лучшим и какие задачи он поставил?", "en": "Which cover-up do you consider your best, and what challenges did it present?"}, "theme": {"ru": "Каменное лицо справедливости", "en": "The Stone Face of Justice"}, "answer": {"ru": "На данный момент мой лучший кавер-ап — это «Каменное лицо справедливости», я так называю эту работу. Перекрывал очень сложную и относительно недавнюю, неудавшуюся татуировку, на которой был изображён некий гитарист без головы. Я остался очень доволен, потому как удалось воплотить идею клиента, вписав её в шрамы, оставшиеся от неумелой техники предыдущего мастера. Старую тату получилось перекрыть за счёт фактуры исходного изображения, а маленькие просветы чистой кожи — использовать для трещин и свечения изнутри. При этом шрамы добавили трещинам на камне эффект 3D.", "en": "At the moment, my best cover-up is “The Stone Face of Justice”, as I call this piece. I covered a very difficult and relatively recent, unsuccessful tattoo that depicted some guitarist without a head. I was very pleased, because I managed to realise the client's idea while incorporating it into the scars left by the previous artist's poor technique. I was able to cover the old tattoo using the texture of the reference image, and use the small gaps of untouched skin for cracks and a glow from within. The scars also gave the cracks in the stone a 3D effect."}, "title_kind": "editorial_reconstructed", "featured_work": 0}, {"id": 8, "title": {"ru": "Как вы оказались в Kwadron и что даёт вам этот опыт?", "en": "How did you become involved with Kwadron, and what does that experience give you?"}, "theme": {"ru": "Опыт с Kwadron", "en": "Experience with Kwadron"}, "answer": {"ru": "В Kwadron я попал благодаря своему учителю! Kwadron открывает неограниченные возможности для совершенствования своих техник татуирования, посещения конвенций и участия в массовых мероприятиях, организованных брендом. Там приобретаешь не только дополнительные знания, но и полезные знакомства в тату-индустрии.", "en": "I became involved with Kwadron thanks to my teacher! Kwadron opens up limitless opportunities to improve your tattooing techniques, attend conventions and take part in large-scale events organised by the brand. There you gain not only additional knowledge, but also useful connections in the tattoo industry."}, "title_kind": "editorial_reconstructed"}, {"id": 9, "title": {"ru": "Как работа в Sagma Tattoo Gallery изменила ваше отношение к татуировке?", "en": "How has working at Sagma Tattoo Gallery changed your attitude towards tattooing?"}, "theme": {"ru": "Sagma Tattoo Gallery", "en": "Sagma Tattoo Gallery"}, "answer": {"ru": "Работа в Sagma Tattoo Gallery полностью поменяла моё отношение к тату, а влияние команды мотивирует двигаться вперёд! Находясь в этой студии, я понял, что быть тату-мастером — это не работа, а стиль жизни!", "en": "Working at Sagma Tattoo Gallery completely changed my attitude towards tattooing, and the team motivates me to keep moving forward! Being in this studio made me realise that being a tattoo artist isn't a job, it's a way of life!"}, "title_kind": "editorial_reconstructed", "featured_portrait": 1}, {"id": 10, "title": {"ru": "Что вы хотели бы изменить в тату-индустрии?", "en": "What would you like to change in the tattoo industry?"}, "theme": {"ru": "Что хочется изменить", "en": "What he would change"}, "answer": {"ru": "Я бы изменил тату-конвенции.", "en": "I would change tattoo conventions."}, "title_kind": "editorial_reconstructed"}, {"id": 11, "title": {"ru": "Как вы относитесь к ИИ в работе тату-мастера и что требуется от мастера при использовании референса?", "en": "How do you view AI in a tattoo artist's work, and what must the artist do when using a reference?"}, "theme": {"ru": "ИИ и работа мастера", "en": "AI and the artist's work"}, "answer": {"ru": "ИИ — это крутой инструмент в руках умелого мастера! Хуже, когда вся суть работы мастера сводится к нелепому копированию рандомного набора бездумных нагромождений бессмысленных фигур. Любой референс должен пройти индивидуальную обработку, уже не говорю об анатомической подгонке изображения под конкретный участок тела.", "en": "AI is a great tool in the hands of a skilled artist! It's worse when the artist's entire work boils down to absurdly copying a random pile of mindless, meaningless shapes. Every reference needs to be adapted individually, not to mention fitting the image anatomically to a specific part of the body."}, "title_kind": "editorial_reconstructed"}, {"id": 12, "title": {"ru": "Что помогает вам двигаться дальше и что вы посоветуете мастеру, который ищет свой стиль?", "en": "What helps you keep moving forward, and what would you advise an artist who is looking for their style?"}, "theme": {"ru": "Учёба и поиск стиля", "en": "Learning and finding a style"}, "answer": {"ru": "Стараюсь не останавливаться на достигнутом, обдумывать каждую работу, постоянно учиться и искать что-то новое! Я не ищу стиль, мне просто нравится идти вперёд! Не зацикливайтесь в начале пути на поиске стиля: ищите свои сильные стороны, подтягивайте слабые, работайте над тем, что вас вдохновляет! Не замыкайтесь в рамках стиля, работайте с вдохновением, а стиль — это лишь продукт усердного труда.", "en": "I try not to rest on what I've achieved, to think through every piece, keep learning and look for something new! I'm not looking for a style; I simply enjoy moving forward! Don't get fixated on finding a style at the start of your journey: find your strengths, improve your weaknesses and work on what inspires you! Don't confine yourself to a style; work with inspiration. A style is simply the product of hard work."}, "title_kind": "editorial_reconstructed"}], "media": {"portrait": "img/wotra/portrait-tablet.jpg", "portraits": [{"src": "img/wotra/portrait-tablet.jpg", "title": {"ru": "Wotra с планшетом", "en": "Wotra with a Tablet"}}, {"src": "img/wotra/portrait-painting.jpg", "title": {"ru": "Wotra за рисованием", "en": "Wotra Drawing"}}], "portfolio": [{"src": "img/wotra/justice.jpg", "category": "other", "title": {"ru": "Каменное лицо справедливости", "en": "The Stone Face of Justice"}}, {"src": "img/wotra/pearl.jpg", "category": "other", "title": {"ru": "Змея с жемчужной серьгой", "en": "Snake with a Pearl Earring"}}, {"src": "img/wotra/cat.jpg", "category": "animal", "title": {"ru": "Кот и городской сюжет", "en": "Cat in an Urban Scene"}}, {"src": "img/wotra/mouse.jpg", "category": "character", "title": {"ru": "Мультяшный мышонок", "en": "Cartoon Mouse"}}, {"src": "img/wotra/dog.jpg", "category": "animal", "title": {"ru": "Собака в кепке и мышь", "en": "Dog in a Cap and a Mouse"}}, {"src": "img/wotra/toys.jpg", "category": "character", "title": {"ru": "Игрушки и фастфуд", "en": "Toys and Fast Food"}}], "video": ""}, "closing_quote": {"ru": "Я не ищу стиль, мне просто нравится идти вперёд!", "en": "I'm not looking for a style; I simply enjoy moving forward!"}, "publication": {"page": "published", "telegram_release": "draft", "pin": "not_requested", "teaser": "draft", "announcement_date": "2026-10-09", "release_date": "2026-10-13", "dates_confirmed_by_owner": true, "owner_edit_and_coauthor_pending": false, "publications_authorized": true, "original_planned_release_date": "2026-10-12", "page_url": "https://tattootut.github.io/interviews/wotra.html"}, "identity_confirmed": true}</script>

let observer;
function observeAnswers(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{entries.filter(e=>e.isIntersecting).forEach(entry=>{document.querySelectorAll('#toc-list a').forEach(a=>a.setAttribute('aria-current',String(a.hash==='#'+entry.target.id)))})},{rootMargin:'-15% 0px -60% 0px'});document.querySelectorAll('.answer').forEach(e=>observer.observe(e))}
function setLanguage(value){lang=value;document.documentElement.lang=lang;document.title=artistName()+' · ТАТУ ТУТ · '+(lang==='ru'?'Интервью №6':'Interview 06');document.querySelector('meta[name=description]').content=tr(data.hero.lead);$('toc-list').setAttribute('aria-label',lang==='ru'?'Темы интервью':'Interview topics');dialog.setAttribute('aria-label',lang==='ru'?'Просмотр фотографий':'Photo viewer');['ru','en'].forEach(l=>$('lang-'+l).setAttribute('aria-pressed',String(lang===l)));document.querySelectorAll('[data-ui]').forEach(e=>e.textContent=ui[lang][e.dataset.ui]);text('preview-notice',ui[lang].preview);$('preview-notice').hidden=data.status!=='preview';text('hero-kicker',(lang==='ru'?'Свои люди · Интервью ':'Our people · Interview ')+String(data.issue_number).padStart(2,'0'));$('hero-title').replaceChildren();const lines=tr(data.hero.title).split('\n');lines.forEach((line,index)=>{if(index>0)$('hero-title').append(element('br'));$('hero-title').append(element('span',index===lines.length-1?'accent-line':'',line))});$('hero-name').replaceChildren(element('strong','',artistName()),document.createTextNode(tr(data.identity.location)?' · '+[tr(data.identity.location),data.identity.studio].filter(Boolean).join(' · ')+' · ':' · '),artistLink());text('hero-lead',tr(data.hero.lead));text('hero-quote','«'+tr(data.hero.quote)+'»');text('portrait-label',artistName()+' / '+data.identity.handle);text('portrait-instagram',data.identity.handle+' ↗');text('footer-instagram',data.identity.handle+' ↗');$('portrait').src=data.media.portrait;$('portrait').alt=artistName()+(lang==='ru'?', герой интервью':', the interview guest');$('brand-mark').src=data.brand.logo;['portrait-instagram','artist-cta','footer-instagram'].forEach(id=>$(id).href=data.identity.instagram_url);text('answer-count',data.chapters.length);text('work-count',data.media.portfolio.length);text('conversation-title',tr(data.article.title));text('conversation-intro',tr(data.article.intro));text('editor-note',tr(data.article.editor_note));text('closing-quote','«'+tr(data.closing_quote)+'»');text('closing-credit',artistName()+' · '+data.identity.handle);$('video-section').hidden=!data.media.video;if(data.media.video){$('video-source').src=data.media.video.src;video.poster=data.media.video.poster}text('play-label',video.paused?ui[lang].play:ui[lang].pause);renderAnswers();renderGallery();if(dialog.open)updateImage()}
$('open-portrait').onclick=()=>openImage(data.media.portfolio.length);$('lang-ru').onclick=()=>setLanguage('ru');$('lang-en').onclick=()=>setLanguage('en');$('viewer-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>document.body.style.overflow='');dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});$('viewer-prev').onclick=()=>changeImage(-1);$('viewer-next').onclick=()=>changeImage(1);document.addEventListener('keydown',e=>{if(dialog.open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();changeImage(e.key==='ArrowLeft'?-1:1)}});$('play-video').onclick=async()=>{if(video.paused){await video.play();video.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'})}else video.pause()};['play','pause','ended'].forEach(event=>video.addEventListener(event,()=>text('play-label',video.paused?ui[lang].play:ui[lang].pause)));$('back-top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('reading-progress').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'},{passive:true});setLanguage(lang);
})();
