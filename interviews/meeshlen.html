<script type="application/json" id="interview-data">{"schema_version": 2, "status": "published", "issue_number": 5, "identity": {"name": "Мишлен", "public_pseudonym": "meeshlen", "handle": "@meeshlen", "location": {"ru": "Воронеж", "en": "Voronezh"}, "instagram_url": "https://www.instagram.com/meeshlen/"}, "brand": {"logo": "img/meeshlen/brand-mark.png"}, "hero": {"title": {"ru": "Когда эскиз\nпора отпустить", "en": "When to let\na sketch go"}, "lead": {"ru": "Кадры из аниме, сомнения после сеанса и правило 80%. Мастер, чьи эскизы узнают раньше автора, рассказывает, как ищет свой почерк — и когда перестаёт переделывать.", "en": "Anime frames, doubts after a session, and the 80% rule. An artist whose designs are recognised before their creator talks about finding his own voice — and knowing when to stop revising."}, "quote": {"ru": "Главный судья моей работы — это я сам.", "en": "The ultimate judge of my work is me."}}, "article": {"title": {"ru": "Эскизы известнее автора", "en": "The designs are better known than the artist"}, "intro": {"ru": "На сеансе — приятный хаос из разговоров и шуток. За эскизом — поиск эмоции, композиции и момента, когда пора остановиться. В двенадцати ответах Мишлен рассказывает о своей работе, клиентах и отношении к нейросетям.", "en": "A session brings a pleasant chaos of stories and jokes. Designing means searching for emotion, composition, and the moment to stop. In twelve answers, meeshlen talks about his work, his clients, and how he feels about neural networks."}, "editor_note": {"ru": "Темы обозначены редакционными заголовками. Ответы мастера сохранены полностью.", "en": "The topic headings were added by the editors. The artist’s answers are presented in full."}}, "chapters": [{"id": 1, "title": {"ru": "Когда эскизы известнее автора", "en": "When the sketches are better known than the artist"}, "answer": {"ru": "Я бы с большим удовольствием был на виду, но в какой-то момент этому сильно помешали блокировки Instagram и необходимость развиваться на других площадках. Плюс, если честно, известен скорее не я, а мои эскизы — их фон, подача, визуал. Многие брали их по всему миру, кто-то даже ездил с ними на фестивали. Мне вообще ближе формат, где я просто показываю проделанную работу без лица, историй из жизни и всего такого. Я не считаю свою бытовуху чем-то особо интересным. Я максимально домашний человек: из экшена у меня либо сложная катка в Dota 2, либо какая-нибудь смешная история с сеанса. Всё остальное — спокойно, просто и потихоньку).", "en": "I'd really enjoy being more visible, but at some point the Instagram restrictions and the need to grow on other platforms got in the way. Plus, honestly, it's more my sketches that people know than me — their backgrounds, presentation, the whole visual treatment. People all over the world have used them; some have even taken them to festivals. Personally, I prefer simply showing the work I've done, without my face, stories from my life, and all that. I don't think my everyday life is especially interesting. I'm a total homebody: the action is either a tough Dota 2 match or some funny story from a session. Everything else is quiet, simple, and one step at a time)."}, "title_kind": "editorial_topic"}, {"id": 2, "title": {"ru": "Правило 80%", "en": "The 80% rule"}, "answer": {"ru": "Да, в целом мне почти за все свои работы немного стыдно. Но не в смысле «ужас, как плохо», а скорее потому, что где-то я не смог нормально реализовать идею на коже, где-то не дожал технически, а где-то не смог уговорить клиента на вариант, который считал сильнее. При этом мне ОЧЕНЬ нужно показывать работы — если я перестану ими делиться, то у меня просто не будет клиентов. Поэтому у меня есть условное правило 80/20: иногда лучше сделать работу на крепкие 80%, показать её и идти дальше, чем бесконечно пытаться выжать из неё 100%.", "en": "Yes, overall I feel a little embarrassed about almost all my work. But not in the sense of 'oh no, this is terrible.' It's more that in some cases I couldn't properly bring an idea to life on skin, in others I didn't push the technique far enough, and sometimes I couldn't persuade the client to choose the version I thought was stronger. At the same time, I REALLY need to show my work — if I stop sharing it, I simply won't have clients. So I have a kind of 80/20 rule: sometimes it's better to make something that's a solid 80%, show it, and move on, rather than endlessly trying to squeeze 100% out of it."}, "title_kind": "editorial_topic", "pullquote": {"ru": "Иногда лучше сделать работу на крепкие 80%, показать её и идти дальше.", "en": "Sometimes it is better to make a solid 80% piece, show it and move on."}, "featured_work": 0}, {"id": 3, "title": {"ru": "Признание и собственная оценка", "en": "Recognition and judging your own work"}, "answer": {"ru": "Для меня это в первую очередь дополнительная возможность для сотрудничества, новых знакомств и каких-то интересных проектов. Ну и, наверное, немного эго и желания признания тоже есть — куда без этого. Но в целом путь каждый выбирает себе сам. Мне нравится, что в конечном счёте главный судья моей работы — это я сам.", "en": "For me, it's primarily another opportunity for collaborations, new connections, and interesting projects. And probably a little ego and a desire for recognition too — of course. But overall, everyone chooses their own path. I like the fact that, in the end, I'm the main judge of my own work."}, "title_kind": "editorial_topic"}, {"id": 4, "title": {"ru": "Люди по другую сторону машинки", "en": "The people on the other side of the machine"}, "answer": {"ru": "Ой, да почти все клиенты. У меня на сеансах обычно царит какой-то приятный хаос из шуток, странных историй и разговоров обо всём подряд. Мне правда нравится слушать людей, спрашивать, как они поступали в разных ситуациях, почему принимали те или иные решения. Иногда даже что-то забираю себе как пример. В общем, клиентов своих я люблю. Такую подборку персонажей ещё попробуй специально найди).", "en": "Oh, practically all my clients. My sessions usually involve a kind of pleasant chaos: jokes, strange stories, and conversations about absolutely everything. I really enjoy listening to people, asking how they handled different situations and why they made certain decisions. Sometimes I even take something away as an example for myself. Basically, I love my clients. Just try deliberately finding a cast of characters like that)."}, "title_kind": "editorial_topic"}, {"id": 5, "title": {"ru": "Почему оценка работы меняется", "en": "Why your assessment of a piece changes"}, "answer": {"ru": "Да почти все). Есть работы, которые в моей внутренней системе оценок получились «нормально» — просто набрали минимальный проходной балл. Условно: один балл за расположение, два за тон, ещё что-то за композицию и так далее. Но работы, которая у меня стабильно держалась бы на 4–5 баллов из 5, пока не было. А чаще всего она для меня на 4, проходит время — уже на 3. Поэтому опять же спасает правило 80%.", "en": "Practically all of them). There are pieces that turned out 'fine' according to my own internal scoring system — they simply reached the minimum passing score. Say, one point for placement, two for tone, something else for composition, and so on. But I haven't made a piece that consistently stays at four or five out of five for me. Most often, I'll see it as a four; some time passes, and it's already a three. So, again, the 80% rule comes to the rescue."}, "title_kind": "editorial_topic"}, {"id": 6, "title": {"ru": "Композиция: от кадра к форме тела", "en": "Composition: from a frame to the body"}, "answer": {"ru": "По композиции мне очень сильно помогли кадры из аниме и игр. Я вообще люблю анализировать картинки и часто задаю себе вопрос: «Почему именно этот кадр вызывает такую эмоцию?» А потом уже пытаюсь перенести это в татуировку: как сохранить тот же эффект, если изображение должно работать не на плоском экране, а на цилиндрической форме руки или ноги. Когда только начинал, ещё много следил за Женей Attic. Такой подход к реализму мне тогда очень заходил.", "en": "Anime and game frames have helped me enormously with composition. I generally enjoy analysing images and often ask myself: 'Why does this particular frame create this emotion?' Then I try to carry that over into a tattoo: how can I preserve the same effect when the image needs to work on the cylindrical shape of an arm or leg, rather than a flat screen? When I was starting out, I also followed Zhenya Attic's work closely. That approach to realism really appealed to me at the time."}, "title_kind": "editorial_topic", "pullquote": {"ru": "Почему именно этот кадр вызывает такую эмоцию?", "en": "Why does this particular frame evoke this emotion?"}, "featured_work": 6}, {"id": 7, "title": {"ru": "Как вовремя закончить эскиз", "en": "Knowing when to finish a sketch"}, "answer": {"ru": "Я во время создания эскиза обычно двигаюсь как принтер — снизу вверх. Ну, по крайней мере стараюсь). И когда дохожу до верхней точки и понимаю, что работа уже набрала мой минимальный проходной балл, стараюсь вовремя остановиться. Потому что если продолжу сидеть над ней, есть большой шанс, что начну переделывать вообще всё. Для меня главное — чтобы работа хотя бы какую-то эмоцию вызвала. А дальше у меня есть максимально странный, но рабочий тест: я сам почти никогда не понимаю, хороший получился эскиз или просто нормальный. Поэтому загружаю его на Pinterest. Если он собирает 5–10 тысяч сохранений — значит, наверное, всё действительно нормально. А иногда внезапно прилетает 20–40 тысяч, и вот тут я уже вообще не понимаю почему. Особенно когда рядом есть работа, которая, на мой взгляд, технически и по дизайну сложнее, но собирает заметно меньше. Хотя объекты и стилистика плюс-минус одинаковые.", "en": "When I'm creating a sketch, I usually move like a printer — from bottom to top. Well, I try to, at least). And once I reach the top and realise the work has met my minimum passing score, I try to stop in time. Because if I keep sitting with it, there's a good chance I'll start redoing absolutely everything. The main thing for me is that the work creates some kind of emotion. After that, I have an extremely strange but useful test: I almost never know whether a sketch turned out good or just okay. So I upload it to Pinterest. If it gets five to ten thousand saves, that probably means it's genuinely okay. Sometimes, twenty to forty thousand suddenly come in, and then I have absolutely no idea why. Especially when there's another piece beside it that, in my view, is more complex technically and in terms of design, but gets noticeably fewer saves. Even though the subjects and style are more or less the same."}, "title_kind": "editorial_topic"}, {"id": 8, "title": {"ru": "Цель и упорство", "en": "A goal and the stubbornness to pursue it"}, "answer": {"ru": "Да, я довольно упёртый. Пару раз в месяц могу поныть, сказать, что всё достало, но бросать всё равно не хочу. Мне очень нравится смотреть, на что я способен, сравнивать новые работы со старыми и видеть, насколько меняется результат. В общем, я просто придумал себе цель и теперь иду к ней своим способом.", "en": "Yes, I'm pretty stubborn. A couple of times a month I might complain and say I've had enough of everything, but I still don't want to quit. I really enjoy seeing what I'm capable of, comparing new work with old pieces, and seeing how much the results change. Basically, I came up with a goal for myself, and now I'm working towards it in my own way."}, "title_kind": "editorial_topic"}, {"id": 9, "title": {"ru": "Откуда приходят сюжеты", "en": "Where subjects come from"}, "answer": {"ru": "Всё очень зависит от того, чем я жил последние пару дней. Если играл во что-то с рыцарями, средневековьем и оружием — скорее всего полезут стилеты, клинки, веера, доспехи и всякие похожие детали. Если смотрел аниме — значит, появится персонаж или какие-нибудь элементы оттуда. Но чаще всего всё равно возвращаюсь к женским персонажам. Через них мне проще всего передавать эмоцию, поэтому их бы я и выбирал чаще.", "en": "It all depends on what I've been immersed in over the past couple of days. If I've been playing something with knights, medieval settings, and weapons, then stilettos, blades, fans, armour, and details like that will probably appear. If I've been watching anime, then a character or elements from it will show up. But most often I still return to female characters. They're the easiest way for me to convey emotion, so I'd choose them more often."}, "title_kind": "editorial_topic", "featured_work": 4}, {"id": 10, "title": {"ru": "Композиция и личные смыслы", "en": "Composition and personal meanings"}, "answer": {"ru": "Я скорее думаю технически: как расположено, насколько хорошо работает композиция, цепляет ли картинка визуально. А если речь идёт про истории в духе: «У меня волк, потому что я одиночка, вою на луну, двигаюсь с братвой и живу в лесу» — мне вообще всё равно). Самое смешное, что мои более интересные работы часто как раз рождаются из максимально тупых или случайных историй, где нет попытки натянуть глубокий смысл на каждый элемент.", "en": "I tend to think technically: how things are placed, how well the composition works, whether the image is visually compelling. And when it comes to stories like, 'I have a wolf because I'm a loner, I howl at the moon, roll with my crew, and live in the forest,' I really don't care). The funniest thing is that my more interesting pieces often come from completely silly or random stories, with no attempt to force a profound meaning onto every element."}, "title_kind": "editorial_topic"}, {"id": 11, "title": {"ru": "Нейросети в работе мастера", "en": "Neural networks in an artist’s work"}, "answer": {"ru": "Как референсы — да, нейросети очень полезны. Как готовый дизайн — не люблю, потому что сразу появляется ощущение, будто я просто что-то спиздил и выдал за своё. У меня есть много эскизов, которые в своё время так и не сложились просто потому, что я не смог нормально встроить найденный референс в композицию. Если бы тогда уже были нынешние нейросети, думаю, получилось бы собрать много интересных для меня дизайнов. Так что на референсы — большой плюс, на готовые дизайны — скорее минус. Хотя рисуют они уже тоже хорошо, что немного грустненько. Машина без проблем заменит половину того, над чем раньше приходилось долго сидеть 🥹", "en": "As references, yes — neural networks are very useful. As a finished design, I'm not a fan, because I immediately feel as though I've ripped something off and passed it off as my own. I have lots of sketches that never came together at the time simply because I couldn't properly fit a reference I'd found into the composition. If today's neural networks had existed back then, I think I could have put together many designs I'd find interesting. So, a big plus for references; more of a minus for finished designs. Although they're already good at drawing too, which is a little sad. A machine can easily replace half the work we used to spend ages on 🥹"}, "title_kind": "editorial_topic", "pullquote": {"ru": "Как референсы — да, нейросети очень полезны.", "en": "As references, yes — neural networks are very useful."}}, {"id": 12, "title": {"ru": "Совет тем, кто сомневается", "en": "Advice for anyone who doubts themselves"}, "answer": {"ru": "Делайте так, как вам в кайф. Чтобы хотелось с улыбкой приходить на работу и примерно с такой же улыбкой с неё уходить. И лишний раз верьте в себя, даже когда кажется, что ничего не получается. Всё постепенно складывается. Удачи!", "en": "Do things in a way you enjoy. So you want to come to work with a smile and leave with roughly the same smile. And believe in yourself a little more, even when it feels like nothing is working out. Gradually, things come together. Good luck!"}, "title_kind": "editorial_topic"}], "media": {"portrait": "img/meeshlen/portrait.jpg", "portfolio": [{"id": 1, "src": "img/meeshlen/work-01.jpg", "title": {"ru": "Персонаж и движение", "en": "Character and movement"}, "category": "character"}, {"id": 2, "src": "img/meeshlen/work-02.jpg", "title": {"ru": "Лошадь и цветы", "en": "Horse and flowers"}, "category": "animal"}, {"id": 3, "src": "img/meeshlen/work-03.jpg", "title": {"ru": "Кошка", "en": "Cat"}, "category": "animal"}, {"id": 4, "src": "img/meeshlen/work-04.jpg", "title": {"ru": "Дракон", "en": "Dragon"}, "category": "other"}, {"id": 5, "src": "img/meeshlen/work-05.jpg", "title": {"ru": "Персонаж из аниме", "en": "Anime character"}, "category": "character"}, {"id": 6, "src": "img/meeshlen/work-06.jpg", "title": {"ru": "Обезьяна", "en": "Monkey"}, "category": "animal"}, {"id": 7, "src": "img/meeshlen/work-07.jpg", "title": {"ru": "Ворота тории", "en": "Torii gate"}, "category": "other"}, {"id": 8, "src": "img/meeshlen/work-08.jpg", "title": {"ru": "Птица", "en": "Bird"}, "category": "animal"}, {"id": 9, "src": "img/meeshlen/work-09.jpg", "title": {"ru": "Женский портрет", "en": "Female portrait"}, "category": "character"}, {"id": 10, "src": "img/meeshlen/work-10.jpg", "title": {"ru": "Крупная кошка", "en": "Big cat"}, "category": "animal"}], "video": {"src": "img/meeshlen/work-video.mp4", "poster": "img/meeshlen/work-01.jpg"}}, "closing_quote": {"ru": "Делайте так, как вам в кайф.", "en": "Do it in a way that you enjoy."}, "publication": {"page": "published", "telegram_release": "authorized", "pin": "authorized", "teaser": "prepare_for_october_2"}}</script>

if(chapter.featured_work!==undefined){const index=chapter.featured_work,item=data.media.portfolio[index];if(item){const figure=element('figure','inline-work'),button=element('button'),img=element('img');button.type='button';button.setAttribute('aria-label',ui[lang].view+': '+tr(item.title));img.src=item.src;img.alt=tr(item.title);img.loading='lazy';button.append(img);button.onclick=()=>openImage(index);const caption=element('figcaption');caption.append(element('span','',data.identity.handle+' · '+tr(item.title)),element('span','',ui[lang].view+' ↗'));figure.append(button,caption);answers.append(figure)}}
});observeAnswers()
}
let observer;
function observeAnswers(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{entries.filter(e=>e.isIntersecting).forEach(entry=>{document.querySelectorAll('#toc-list a').forEach(a=>a.setAttribute('aria-current',String(a.hash==='#'+entry.target.id)))})},{rootMargin:'-15% 0px -60% 0px'});document.querySelectorAll('.answer').forEach(e=>observer.observe(e))}
function setLanguage(value){lang=value;document.documentElement.lang=lang;['ru','en'].forEach(l=>$('lang-'+l).setAttribute('aria-pressed',String(lang===l)));document.querySelectorAll('[data-ui]').forEach(e=>e.textContent=ui[lang][e.dataset.ui]);text('preview-notice',ui[lang].preview);$('preview-notice').hidden=data.status!=='preview';text('hero-kicker',(lang==='ru'?'Свои люди · Интервью ':'Our people · Interview ')+String(data.issue_number).padStart(2,'0'));$('hero-title').replaceChildren();const lines=tr(data.hero.title).split('\n');lines.forEach((line,index)=>{if(index>0)$('hero-title').append(element('br'));$('hero-title').append(element('span',index===lines.length-1?'accent-line':'',line))});$('hero-name').replaceChildren(element('strong','',data.identity.name),document.createTextNode(' · '+tr(data.identity.location)+' · '),artistLink());text('hero-lead',tr(data.hero.lead));text('hero-quote','«'+tr(data.hero.quote)+'»');text('portrait-label',data.identity.name+' / '+data.identity.handle);$('portrait').src=data.media.portrait;$('portrait').alt=data.identity.name+(lang==='ru'?', герой интервью':', the interview guest');$('brand-mark').src=data.brand.logo;['portrait-instagram','artist-cta','footer-instagram'].forEach(id=>$(id).href=data.identity.instagram_url);text('answer-count',data.chapters.length);text('work-count',data.media.portfolio.length);text('conversation-title',tr(data.article.title));text('conversation-intro',tr(data.article.intro));text('editor-note',tr(data.article.editor_note));text('closing-quote','«'+tr(data.closing_quote)+'»');text('closing-credit',data.identity.name+' · '+data.identity.handle);$('video-section').hidden=!data.media.video;if(data.media.video){$('video-source').src=data.media.video.src;video.poster=data.media.video.poster}text('play-label',video.paused?ui[lang].play:ui[lang].pause);renderAnswers();renderGallery();if(dialog.open)updateImage()}
$('lang-ru').onclick=()=>setLanguage('ru');$('lang-en').onclick=()=>setLanguage('en');$('viewer-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>document.body.style.overflow='');dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});$('viewer-prev').onclick=()=>changeImage(-1);$('viewer-next').onclick=()=>changeImage(1);document.addEventListener('keydown',e=>{if(dialog.open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();changeImage(e.key==='ArrowLeft'?-1:1)}});$('play-video').onclick=async()=>{if(video.paused){await video.play();video.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'})}else video.pause()};['play','pause','ended'].forEach(event=>video.addEventListener(event,()=>text('play-label',video.paused?ui[lang].play:ui[lang].pause)));$('back-top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('reading-progress').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'},{passive:true});setLanguage(lang);
})();
